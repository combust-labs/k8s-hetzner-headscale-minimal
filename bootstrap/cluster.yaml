---
config_format_version: 1
kubeconfig_path: "~/.hetzner/kube/svcssh"
cluster_name: svcssh-infrastructure
k3s_version: v1.36.5+k3s1

networking:
  ssh:
    port: 22
    use_agent: false
    public_key_path: "~/.hetzner/ssh/svcssh_rsa.pub"
    private_key_path: "~/.hetzner/ssh/svcssh_rsa"
  allowed_networks:
    ssh: 
    - 0.0.0.0/0
    api:
    - 0.0.0.0/0
  public_network:
    ipv4: true
    ipv6: false
  private_network:
    enabled: true
    subnet: 10.0.0.0/16
  cni:
    enabled: true
    encryption: false
    mode: cilium
    cilium:
      # Optional: specify a path to a custom values file for Cilium Helm chart
      # When specified, this file will be used instead of the default values
      helm_values_path: "cilium-values.yaml" # set by the installer
      chart_version: "v1.20.4"
  cluster_cidr: 10.244.0.0/16 # optional: a custom IPv4/IPv6 network CIDR to use for pod IPs
  service_cidr: 10.43.0.0/16 # optional: a custom IPv4/IPv6 network CIDR to use for service IPs. Warning, if you change this, you should also change cluster_dns!
  cluster_dns: 10.43.0.10 # optional: IPv4 Cluster IP for coredns service. Needs to be an address from the service_cidr range

schedule_workloads_on_masters: false
protect_against_deletion: false

# image: rocky-9 # optional: default is ubuntu-24.04
# snapshot_os: microos # otional: specified the os type when using a custom snapshot
masters_pool:
  instance_type: cpx22
  instance_count: 1
  locations:
  - nbg1

worker_node_pools:
- name: small
  instance_type: cpx22
  instance_count: 3
  location: nbg1

addons:
  cluster_autoscaler:
    enabled: false
