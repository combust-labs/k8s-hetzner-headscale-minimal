bgpControlPlane:
  enabled: true
bpf:
  masquerade: false
  lbExternalClusterIP: true
cluster:
  name: svcssh
cni:
  # when using Istio with CNI
  # https://docs.cilium.io/en/latest/network/servicemesh/istio/
  exclusive: false
debug:
  enabled: false
envoy:
  enabled: true
  securityContext:
    capabilities:
      keepCapNetBindService: true
      envoy:
      # Add NET_BIND_SERVICE to the list (keep the others!)
      - NET_ADMIN
      - PERFMON
      - BPF
      - NET_BIND_SERVICE
  image:
    override: quay.io/cilium/cilium-envoy:v1.39.5-1792733054-8c73b2816bc8239e27f1fd53b271884688137459 # set by the installer
envoyConfig:
  enabled: true
gatewayAPI:
  # Enabling Gateway API enables enable-envoy-config.
  # I enabled that option explicitly above.
  # Since there are no load balancers in the embedded cluster, 
  # I set the hostNetwork.enabled=true
  # https://docs.cilium.io/en/stable/network/servicemesh/gateway-api/gateway-api/#host-network-mode
  enabled: true
  # Enable Application-Layer Protocol Negotiation (ALPN) which wil attempt HTTP/2, then HTTP 1.1.
  # Services that wish to use HTTP/2 must indicate that via their appProtocol (GEP-1911).
  enableAlpn: true
  gatewayClass:
    # CRDs of the GatewayAPI are installed after Cilium.
    # To be able to run subsequent cluster launches, we have to skip
    # the installation of the GatewayClass because the same GatewayClass
    # is created manually. Subsequent re-launches of the cluster fail with
    #
    # [CNI] Error: UPGRADE FAILED: Unable to continue with update: GatewayClass 
    #              "cilium" in namespace "" exists and cannot be imported into 
    #              the current release: invalid ownership metadata; label 
    #              validation error: missing key "app.kubernetes.io/managed-by":
    #              must be set to "Helm"; annotation validation error: missing 
    #              key "meta.helm.sh/release-name": must be set to "cilium"; 
    #              annotation validation error: missing key 
    #              "meta.helm.sh/release-namespace": must be set 
    #              to "kube-system"
    create: "false"
hubble:
  relay:
    enabled: true
  ui:
    enabled: true
ingressController:
  enabled: true
  ingressLBAnnotationPrefixes:
  - lbipam.cilium.io
  - nodeipam.cilium.io
  - service.beta.kubernetes.io
  - service.kubernetes.io
  - cloud.google.com
  - load-balancer.hetzner.cloud
image:
  pullPolicy: IfNotPresent
ipam:
  mode: kubernetes
kubeProxyReplacement: "true"
k8sServiceHost: 10.0.0.2
k8sServicePort: 6443
operator:
  image:
    override: quay.io/cilium/operator-generic:v1.20.4 # set by the installer
  replicas: 1
  rollOutPods: true
securityContext:
  capabilities:
    # -- Capabilities for the `cilium-agent` container, tale default
    #    add NET_BIND_SERVICE
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_BIND_SERVICE
      - NET_RAW
      - IPC_LOCK
      - SYS_MODULE
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
socketLB:
  # when using Istio with CNI
  # https://docs.cilium.io/en/latest/network/servicemesh/istio/
  hostNamespaceOnly: true

