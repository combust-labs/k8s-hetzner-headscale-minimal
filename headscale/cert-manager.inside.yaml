---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: headscale-le-inside
  namespace: headscale
spec:
  acme:
    email: radek@gruchalski.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: headscale-le-inside-private-key
    solvers:
    - dns01:
        route53:
          region: eu-central-1
          accessKeyIDSecretRef:
            name: route53-dns01-credential-secret
            key: access_key_id
          secretAccessKeySecretRef:
            name: route53-dns01-credential-secret
            key: secret_access_key
          hostedZoneID: Z093150716J6UQV18EQ81
---
# Certificate used internally for any domain name in *.in.svcs.sh
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: head-in-certificate
  namespace: headscale
spec:
  dnsNames:
  - "*.in.svcs.sh"
  secretName: head-in-certificate-secret
  issuerRef:
    name: headscale-le-inside
    kind: Issuer
