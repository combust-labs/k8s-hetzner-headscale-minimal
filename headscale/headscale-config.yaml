---
# Headscale configuration.
apiVersion: v1
kind: ConfigMap
metadata:
  name: headscale-config
  namespace: headscale
data:
  config.yaml: |
    server_url: https://head.svcs.sh
    listen_addr: 0.0.0.0:8080
    metrics_listen_addr: 127.0.0.1:9090
    grpc_listen_addr: 0.0.0.0:50443
    noise:
      private_key_path: /opt/headscale/noise_private.key
    private_key_path: /opt/headscale/private.key
    prefixes:
      v4: 100.64.0.0/10
      v6: fd7a:115c:a1e0::/48
    derp:
      server:
        enabled: false
        region_id: 999
        region_code: "headscale"
        region_name: "Headscale Embedded DERP"
        verify_clients: true
        stun_listen_addr: "0.0.0.0:3478"
        private_key_path: /opt/headscale/derp_server_private.key
        automatically_add_embedded_derp_region: true
        ipv4: 198.51.100.1
        ipv6: 2001:db8::1
      urls:
      - https://controlplane.tailscale.com/derpmap/default
      auto_update_enabled: true
      update_frequency: 3h
    disable_check_updates: true
    database:
      type: sqlite
      sqlite:
        path: /opt/headscale/db.sqlite
    log:
      format: text
      level: info
    dns:
      magic_dns: true
      base_domain: in.svcs.sh
      override_local_dns: true
      nameservers:
        global:
        - 1.1.1.1
        - 1.0.0.1
        - 2606:4700:4700::1111
        - 2606:4700:4700::1001
    logtail:
      enabled: false
    tls_cert_path: "/etc/pki/headscale-outside/tls.crt"
    tls_key_path: "/etc/pki/headscale-outside/tls.key"
